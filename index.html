<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beranda</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="page-wrap">
    <div id="pengumuman-slot"></div>

    <h1>Selamat datang</h1>
    <p class="text-muted" id="pesan-status"></p>

    <!-- Tampil kalau belum login -->
    <div id="login-box" class="card" style="max-width:380px; margin-top:24px;">
      <h2 style="font-size:16px;">Masuk tanpa password</h2>
      <p class="text-muted" style="margin-bottom:16px;">
        Masukkan email, kami kirim tautan login ke sana.
      </p>
      <input type="email" id="email-input" class="input" placeholder="nama@email.com" style="margin-bottom:12px;">
      <button class="btn btn-primary" style="width:100%;" onclick="prosesKirimLink()">Kirim Tautan Login</button>
      <p class="text-muted" id="login-feedback" style="margin-top:12px; margin-bottom:0;"></p>
    </div>

    <!-- Tampil kalau sudah login -->
    <div id="welcome-box" class="card" style="max-width:380px; margin-top:24px; display:none;">
      <p>Kamu sudah login sebagai <b id="welcome-email"></b>.</p>
      <button class="btn" onclick="logout()">Logout</button>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/profile-badge.js"></script>
  <script>
    renderSidebar('beranda');
    renderProfileBadge();
    muatPengumuman();

    /** Ubah URL polos jadi tautan yang bisa diklik, sisanya tetap aman (di-escape) */
    function formatTeksPengumuman(teks) {
      const aman = document.createElement('div');
      aman.textContent = teks;
      const escaped = aman.innerHTML;
      return escaped.replace(/(https?:\/\/[^\s<]+)/g, (url) =>
        `<a href="${url}" target="_blank" rel="noopener">${url}</a>`
      );
    }

    async function muatPengumuman() {
      const batasWaktu = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();
      const { data, error } = await supabaseClient
        .from('pengumuman')
        .select('*')
        .gt('created_at', batasWaktu)
        .order('created_at', { ascending: false })
        .limit(1);

      if (error || !data || data.length === 0) return;

      const slot = document.getElementById('pengumuman-slot');
      slot.innerHTML = `
        <div class="pengumuman-banner">
          <span class="pengumuman-label">Pengumuman</span>
          ${formatTeksPengumuman(data[0].isi)}
        </div>
      `;
    }

    // Tampilkan pesan kalau user diarahkan ke sini karena belum login
    const params = new URLSearchParams(window.location.search);
    if (params.get('login') === 'required') {
      document.getElementById('pesan-status').textContent =
        'Silakan login dulu untuk mengakses halaman itu.';
    } else if (params.get('akses') === 'ditolak') {
      document.getElementById('pesan-status').textContent =
        'Akun kamu tidak punya akses admin.';
    }

    async function prosesKirimLink() {
      const email = document.getElementById('email-input').value.trim();
      const feedback = document.getElementById('login-feedback');
      if (!email) {
        feedback.textContent = 'Masukkan email dulu.';
        return;
      }
      feedback.textContent = 'Mengirim tautan...';
      const error = await kirimMagicLink(email);
      feedback.textContent = error ? ('Gagal: ' + error) : 'Cek email kamu, tautan login sudah dikirim.';
    }

    // Cek status login saat halaman dimuat, sesuaikan tampilan
    (async () => {
      const session = await getSession();
      if (session) {
        document.getElementById('login-box').style.display = 'none';
        document.getElementById('welcome-box').style.display = 'block';
        document.getElementById('welcome-email').textContent = session.user.email;
      }
    })();
  </script>
</body>
</html>

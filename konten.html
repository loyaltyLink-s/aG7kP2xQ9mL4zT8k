<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Konten</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="page-wrap">
    <h1>Konten</h1>
    <p class="text-muted">Semua file yang tersedia untuk diunduh.</p>

    <div id="loading-state" class="empty-state">Memuat konten...</div>
    <div id="content-grid" class="content-grid"></div>
    <div id="empty-state" class="empty-state" style="display:none;">
      Belum ada konten yang tersedia.
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/profile-badge.js"></script>
  <script>
    // GANTI dengan Web app URL hasil deploy apps-script/Code.gs
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyyFKT-slhtYwZcjZnxTjtOxTfEHowNyJGf19TC_GysANMnTqFlIUhQmC5bEbl4Gcs18Q/exec';

    renderSidebar('konten');
    renderProfileBadge();

    function formatTanggal(iso) {
      return new Date(iso).toLocaleDateString('id-ID', {
        day: 'numeric', month: 'long', year: 'numeric',
      });
    }

    function escapeHTML(teks) {
      const div = document.createElement('div');
      div.textContent = teks ?? '';
      return div.innerHTML;
    }

    /** Ambil file lewat proxy Apps Script (JSON+base64), lalu picu download di browser */
    async function unduhFile(event, driveFileId) {
      const session = await getSession();
      if (!session) {
        window.location.href = 'index.html?login=required';
        return;
      }

      const tombol = event.currentTarget;
      const teksAsli = tombol.textContent;
      tombol.textContent = 'Mengunduh...';
      tombol.disabled = true;

      try {
        const url = `${APPS_SCRIPT_URL}?id=${encodeURIComponent(driveFileId)}&token=${encodeURIComponent(session.access_token)}`;
        const res = await fetch(url);
        const hasil = await res.json();

        if (hasil.error) {
          alert('Gagal mengunduh: ' + hasil.error);
          return;
        }

        const byteChar = atob(hasil.dataBase64);
        const bytes = new Uint8Array(byteChar.length);
        for (let i = 0; i < byteChar.length; i++) bytes[i] = byteChar.charCodeAt(i);
        const blob = new Blob([bytes], { type: hasil.mimeType || 'application/octet-stream' });

        const blobUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = hasil.fileName || 'file';
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(blobUrl);
      } catch (err) {
        alert('Terjadi kesalahan saat mengunduh: ' + err.message);
      } finally {
        tombol.textContent = teksAsli;
        tombol.disabled = false;
      }
    }

    async function muatKonten() {
      const { data, error } = await supabaseClient
        .from('konten')
        .select('*')
        .order('uploaded_at', { ascending: false });

      const grid = document.getElementById('content-grid');
      const emptyState = document.getElementById('empty-state');
      const loadingState = document.getElementById('loading-state');
      loadingState.style.display = 'none';

      if (error) {
        grid.innerHTML = `<p class="text-muted">Gagal memuat konten: ${escapeHTML(error.message)}</p>`;
        return;
      }

      if (!data || data.length === 0) {
        emptyState.style.display = 'block';
        return;
      }

      grid.innerHTML = data.map(item => `
        <div class="content-card">
          <img class="content-thumb" src="${escapeHTML(item.thumbnail_url) || 'assets/default-thumb.png'}"
               alt="${escapeHTML(item.judul)}"
               onerror="this.onerror=null; this.src='assets/default-thumb.png';">
          <div class="content-body">
            <div class="content-judul">${escapeHTML(item.judul)}</div>
            <div class="content-tanggal">${formatTanggal(item.uploaded_at)}</div>
            <button class="btn btn-primary" onclick="unduhFile(event, '${escapeHTML(item.drive_file_id)}')">
              Download
            </button>
          </div>
        </div>
      `).join('');
    }

    (async () => {
      const session = await requireAuth();
      if (!session) return; // sudah di-redirect oleh requireAuth()
      await muatKonten();
    })();
  </script>
</body>
</html>
